# The worker has no HTTP server, so it has no probes: it exits on a fatal
# error and Kubernetes restarts it. Scale with replicas, or with
# WORKER_CONCURRENCY for more tasks per pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # A task in flight is requeued on shutdown and redone by another
      # worker; the deterministic message ids make that harmless.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: controlplane-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: worker-config }
          env:
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: controlplane-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: controlplane-secrets, key: RABBITMQ_PASSWORD } }
            - name: AMQP_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
