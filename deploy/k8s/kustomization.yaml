# Apply with: kubectl apply -k deploy/k8s   (make k8s-up does this for you)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: controlplane

labels:
  - pairs:
      app.kubernetes.io/part-of: controlplane
    includeSelectors: false

resources:
  - postgres.yaml
  - rabbitmq.yaml
  - controlplane.yaml
  - worker.yaml

# Settings that aren't secret. Change a value here and re-run `make k8s-up`:
# the ConfigMap name gets a new hash suffix, so the pods restart with it.
configMapGenerator:
  - name: controlplane-config
    literals:
      - HTTP_ADDR=:8000
      - DB_DRIVER=postgres
      - RELAY_INTERVAL=500ms
      - LOG_LEVEL=info
  - name: worker-config
    literals:
      - LOG_LEVEL=info
      - WORKER_FAIL_RATE=0.0
      - WORKER_MIN_DELAY_MS=500
      - WORKER_MAX_DELAY_MS=2000
      - WORKER_DUPLICATE_RATE=0.0
      - WORKER_SKIP_IN_PROGRESS=false
      - WORKER_CONCURRENCY=4

# Passwords. secret.env is generated from .env by `make k8s-up` and is
# git-ignored, so no password is ever committed.
secretGenerator:
  - name: controlplane-secrets
    envs:
      - secret.env

# Images are built locally and loaded into kind. To deploy from a registry,
# set newName/newTag here (or with `kustomize edit set image`).
images:
  - name: controlplane
    newTag: local
  - name: controlplane-worker
    newTag: local
